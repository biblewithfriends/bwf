<style>
  :root { --bar: rgba(0, 0, 0, .55); --ink: #fff; --soft: rgba(255, 255, 255, .72); --gold: #E8C796; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  .cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,10,30,0) 50%, rgba(6,10,30,.45) 100%); }
  .cover .in { position: relative; margin: 0 14px max(28px, calc(env(safe-area-inset-bottom) + 18px)); padding: 26px 18px 22px; max-width: 620px;
    background: rgba(8, 12, 30, .78); border: 1px solid rgba(232,199,150,.35); border-radius: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .cover .sub { margin: 6px 0 22px; font: 400 clamp(1.45rem, 6.5vw, 3.05rem)/1.08 Georgia, "Times New Roman", serif; color: var(--gold); }

  .cover .go { display: inline-flex; align-items: center; gap: 10px; background: var(--gold); color: #3b2a12; font-weight: 700; font-size: 1.05rem; padding: 14px 26px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .cover .go[hidden] { display: none; }
  .cover .soon { color: #f3e6cf; font-weight: 600; }
  .connect { display: table; margin: 16px auto 0; color: #f3e6cf; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(243,230,207,.5); padding-bottom: 2px; }
  .connect:hover { color: #fff; border-color: #fff; }
  .connect.card-link { display: block; max-width: 1100px; margin: 22px auto 0; padding: 16px 18px; border: 1px solid rgba(232,199,150,.45); border-radius: 16px; background: rgba(10,14,34,.6); text-shadow: none; }
  .connect.card-link b { display: block; font: 700 1.15rem Georgia, "Times New Roman", serif; color: var(--gold); }
  .connect.card-link span { color: var(--soft); font-weight: 500; }
  .albums .gtop .title small { display: block; font: 500 .8rem system-ui, sans-serif; color: var(--soft); }
  body.started .cover { opacity: 0; pointer-events: none; }

  /* the photo */
  .stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; }
  .stage img { max-width: 100vw; max-height: 100vh; max-height: 100dvh; width: auto; height: auto; object-fit: contain; display: block; opacity: 0; transition: opacity .25s; }
  .stage img.on { opacity: 1; }
  .spin { position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(1turn); } }
  .spin[hidden] { display: none; }

  /* bars (tap the photo to hide/show) */
  .top, .bottom { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 6px; padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left)); z-index: 5; transition: opacity .25s, transform .25s; }
  .top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); background: linear-gradient(var(--bar), transparent); }
  .bottom { bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bar)); justify-content: center; }
  body.clean .top, body.clean .bottom, body.clean .nav { opacity: 0; pointer-events: none; }
  .title { font-weight: 700; letter-spacing: .02em; margin-right: auto; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .title small { display: block; font-weight: 500; color: var(--soft); font-size: .8rem; }
  .ico { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 1.15rem; background: rgba(0,0,0,.35); text-decoration: none; color: #fff; }
  .ico:hover, .ico:focus-visible { background: rgba(255,255,255,.18); outline: none; }
  .ico svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); font-weight: 600; }
  .pill svg { width: 19px; height: 19px; fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  .pill b { background: var(--gold); color: #3b2a12; border-radius: 999px; padding: 0 8px; font-size: .82rem; }
  .pill b:empty { display: none; }
  .pill.heart { padding: 10px 14px; }
  .pill.heart svg { width: 21px; height: 21px; transition: transform .2s; }
  .pill.heart path { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  .pill.heart[aria-pressed="true"] path { fill: #ff4d6d; stroke: #ff4d6d; }
  .pill.heart[aria-pressed="true"] svg { animation: pop .35s ease; }
  .pill.heart b { background: none; color: #fff; padding: 0; font-size: .95rem; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .count { color: var(--soft); font-variant-numeric: tabular-nums; min-width: 84px; text-align: center; }
  @media (max-width: 600px) { .count { min-width: 0; margin-right: 4px; font-size: .9rem; } .count[aria-hidden] { display: none; } .pill { padding: 9px 14px; } }

  /* side arrows (bigger screens) */
  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 4; width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.35); display: grid; place-items: center; transition: opacity .25s; }
  .nav svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .nav.prev { left: max(12px, env(safe-area-inset-left)); } .nav.next { right: max(12px, env(safe-area-inset-right)); }
  .nav:hover { background: rgba(255,255,255,.18); }
  @media (hover: none) { .nav { display: none; } }

  /* comments panel */
  .panel { position: fixed; z-index: 8; background: #15161a; color: #f2f2f2; display: flex; flex-direction: column; transition: transform .3s ease; box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  @media (min-width: 820px) { .panel { top: 0; right: 0; bottom: 0; width: 380px; transform: translateX(100%); } body.talk .panel { transform: none; } body.talk .stage { right: 380px; } body.talk .nav.next { right: 392px; } }
  @media (max-width: 819px) { .panel { left: 0; right: 0; bottom: 0; max-height: 72vh; max-height: 72dvh; border-radius: 18px 18px 0 0; transform: translateY(105%); } body.talk .panel { transform: none; } }
  .panel header { display: flex; align-items: center; padding: 14px 16px 10px; border-bottom: 1px solid #2a2c33; }
  .panel header h2 { margin: 0; font-size: 1.05rem; margin-right: auto; }
  .list { overflow-y: auto; padding: 8px 16px; flex: 1; min-height: 80px; -webkit-overflow-scrolling: touch; }
  .cm { padding: 10px 0; border-bottom: 1px solid #24262c; }
  .cm b { font-weight: 650; } .cm time { color: #8b8f99; font-size: .8rem; margin-left: 6px; }
  .cm p { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .none { color: #8b8f99; padding: 14px 0; }
  form { padding: 12px 16px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2c33; display: grid; gap: 8px; }
  input, textarea { width: 100%; font: inherit; color: #fff; background: #23252b; border: 1px solid #343741; border-radius: 12px; padding: 10px 12px; }
  textarea { resize: none; height: 72px; }
  input:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .send { background: var(--gold); color: #3b2a12; font-weight: 700; border-radius: 12px; padding: 10px 18px; }
  .send:disabled { opacity: .6; }
  .err { color: #ff9b8a; font-size: .85rem; min-height: 1em; margin: 0; }
  .hp { position: absolute; left: -9999px; }

  /* albums */
  .albums { position: fixed; inset: 0; z-index: 10; overflow-y: auto; display: none; padding: max(70px, calc(env(safe-area-inset-top) + 62px)) 14px 30px; }
  body.albumson .albums { display: block; }
  .albums .gtop { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: linear-gradient(rgba(6,10,30,.85), rgba(6,10,30,.55)); backdrop-filter: blur(6px); }
  .albums .gtop .title { font: 700 1.35rem Georgia, "Times New Roman", serif; }
  .alist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
  .album { position: relative; display: block; width: 100%; padding: 0; text-align: left; border-radius: 16px; overflow: hidden; background: #1a1d2a; box-shadow: 0 10px 30px rgba(0,0,0,.45); aspect-ratio: 4 / 3; }
  .album img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .album:hover img { transform: scale(1.04); }
  .album .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .album .cap b { display: block; font: 700 1.2rem Georgia, "Times New Roman", serif; }
  .album .cap small { color: var(--soft); }
  .album .num { position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #3b2a12; font-weight: 800; display: grid; place-items: center; font-size: .9rem; }
  @media (max-width: 600px) { .alist { grid-template-columns: 1fr 1fr; gap: 10px; } .album { aspect-ratio: 4 / 5; border-radius: 12px; } .album .cap b { font-size: 1rem; } .album .cap { padding: 26px 10px 9px; } }
  body.albumson .backdrop { filter: blur(10px) brightness(.45); }
  body.albumson .top, body.albumson .bottom, body.albumson .nav, body.albumson .stage { visibility: hidden; }

  /* all photos grid */
  .grid { position: fixed; inset: 0; z-index: 9; background: #0b0b0d; overflow-y: auto; display: none; padding: max(64px, calc(env(safe-area-inset-top) + 56px)) 6px 20px; }
  body.gridon .grid { display: block; }
  .grid .gtop { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: rgba(11,11,13,.92); backdrop-filter: blur(6px); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px; }
  .tiles button { position: relative; aspect-ratio: 1; background: #1c1d22; border-radius: 4px; overflow: hidden; padding: 0; }
  .tiles img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tiles span { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.6); border-radius: 999px; padding: 0 7px; font-size: .75rem; }
  .tiles button.cur { outline: 3px solid var(--gold); outline-offset: -3px; }

  .toast { position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 60px)); transform: translateX(-50%); background: rgba(30,30,34,.95); padding: 9px 16px; border-radius: 999px; z-index: 20; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="stage" id="stage"><img id="img" alt=""></div>
<div class="spin" id="spin" hidden></div>
<div class="cover" id="cover">
  <div class="in">
    <h1>Church in Burlingame</h1>
    <p class="sub">2026 Thanksgiving Dinner</p>
    <button class="go" id="go" type="button" hidden>See the photos</button>
    <div class="soon" id="msgText">Loading the photos…</div>
    <a class="connect" href="https://biblewfriends.org/connect.html">Connect with us · Bible with Friends →</a>
  </div>
</div>

<div class="top">
  <button class="ico" id="backBtn" type="button" aria-label="Back to the albums" title="Albums"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="title"><span id="albumName">2026 Thanksgiving Dinner</span><small>Church in Burlingame</small></div>
  <button class="ico" id="gridBtn" type="button" aria-label="All photos in this album" title="All photos in this album"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
  <a class="ico" id="dl" target="_blank" rel="noopener" aria-label="Download the original photo" title="Download the original"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></a>
  <button class="ico" id="fsBtn" type="button" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<button class="nav prev" id="prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav next" id="next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="bottom">
  <span class="count" id="count" aria-live="polite"></span>
  <button class="pill heart" id="heartBtn" type="button" aria-pressed="false" aria-label="Heart this photo"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.3 3 5 6.3 5c2 0 3.3 1.1 4 2.3h3.4C14.4 6.1 15.7 5 17.7 5 21 5 22.8 8.3 21.2 11.4 19 15.6 12 20 12 20z"/></svg><b id="hN"></b></button>
  <button class="pill" id="talkBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Comments <b id="cmN"></b></button>
  <span class="count" aria-hidden="true"></span>
</div>

<aside class="panel" id="panel" aria-label="Comments on this photo">
  <header><h2 id="panelTitle">Comments</h2><button class="ico" id="closeTalk" type="button" aria-label="Close comments"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="list" id="list"></div>
  <form id="form" autocomplete="on">
    <label class="sr" for="text">Your comment</label>
    <textarea id="text" maxlength="500" placeholder="Leave a comment on this photo…" required></textarea>
    <div class="row">
      <label class="sr" for="name">Your name</label>
      <input id="name" maxlength="40" placeholder="Your name (optional)" autocomplete="given-name">
      <button class="send" id="send" type="submit">Post</button>
    </div>
    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="err" role="alert"></p>
  </form>
</aside>

<div class="albums" id="albums" role="dialog" aria-label="Albums">
  <div class="gtop"><div class="title">Church in Burlingame<small>2026 Thanksgiving Dinner</small></div></div>
  <div class="alist" id="alist"></div>
  <a class="connect card-link" href="https://biblewfriends.org/connect.html"><b>Connect with us</b><span>Read the Bible with friends — biblewfriends.org</span></a>
</div>

<div class="grid" id="grid" role="dialog" aria-label="All photos">
  <div class="gtop"><div class="title"><span id="gridTitle">All photos</span> <small id="gridN"></small></div><button class="ico" id="gridClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tiles" id="tiles"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// The Apps Script web app link (ends in /exec). Leave empty until the photos are uploaded.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybImmZ74kwhX_ni85dXc1toyUu0fFDf9nZUlBchNZea_Y_TnwsXxCmDbMVsdqTS4TlNA/exec";
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const img = $("img");
  let albums = [], A = 0, photos = [], comments = [], hearts = {}, i = 0, loadToken = 0;
  let mine = {}; try { mine = JSON.parse(localStorage.getItem("tg_hearts") || "{}"); } catch (e) {}
  const label = n => String(n).replace(/^\s*\d+\s*[-–.)]\s*/, "");   // "1 - Welcome" → "Welcome"

  // ---------- photo addresses (Google Drive) ----------
  // shown at the size of the screen (sharp on phones and big monitors); "download" gives the untouched original
  const screenW = () => Math.min(4096, Math.max(2048, Math.ceil(Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1) / 256) * 256));
  const big = id => `https://lh3.googleusercontent.com/d/${id}=w${screenW()}-h${screenW()}`;
  const bigAlt = id => `https://drive.google.com/thumbnail?id=${id}&sz=w${screenW()}`;
  const thumb = id => `https://lh3.googleusercontent.com/d/${id}=w300-h300-c`;
  const thumbBig = id => `https://lh3.googleusercontent.com/d/${id}=w800-h600-c`;
  const original = id => `https://drive.google.com/uc?export=download&id=${id}`;

  // ---------- data ----------
  async function load() {
    if (!SCRIPT_URL) { $("msgText").textContent = "The photos will be here soon."; return; }
    try {
      const r = await fetch(SCRIPT_URL + "?action=list&t=" + Date.now());
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Could not load");
      albums = (d.albums || []).map(x => ({ name: x.name, photos: (x.photos || []).map(id => ({ id })) })).filter(x => x.photos.length);
      comments = d.comments || []; hearts = d.hearts || {};
      const total = albums.reduce((n, x) => n + x.photos.length, 0);
      if (!total) { $("msgText").textContent = "The photos will be here soon."; return; }
      $("msgText").textContent = ""; $("go").textContent = "See the " + total + " photos"; $("go").hidden = false;
      $("go").onclick = () => { document.body.classList.add("started"); openAlbums(); };
      // a shared link to one photo (#album-photo) opens it right away
      const m = location.hash.match(/^#(\d+)-(\d+)$/);
      if (m && albums[m[1] - 1] && m[2] >= 1 && m[2] <= albums[m[1] - 1].photos.length) { document.body.classList.add("started"); openAlbum(m[1] - 1, m[2] - 1); }
      else if (location.hash === "#albums") { document.body.classList.add("started"); openAlbums(); }
      else new Image().src = thumb(albums[0].photos[0].id);
    } catch (e) { $("msgText").textContent = "Couldn’t load the photos. Please refresh in a minute."; }
  }

  // ---------- albums ----------
  function openAlbums() {
    const box = $("alist");
    if (!box.children.length) albums.forEach((al, k) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "album";
      b.innerHTML = `<img alt="" loading="lazy" src="${thumbBig(al.photos[0].id)}"><span class="num">${k + 1}</span><span class="cap"><b></b><small></small></span>`;
      b.querySelector("b").textContent = label(al.name);
      b.querySelector("small").textContent = al.photos.length + (al.photos.length === 1 ? " photo" : " photos");
      b.onclick = () => openAlbum(k, 0);
      box.appendChild(b);
    });
    document.body.classList.remove("talk", "gridon", "clean");
    document.body.classList.add("albumson");
    history.replaceState(null, "", "#albums");
  }
  function openAlbum(k, start) {
    A = k; photos = albums[k].photos;
    $("albumName").textContent = label(albums[k].name);
    $("tiles").innerHTML = "";
    document.body.classList.remove("albumson");
    show(start || 0);
  }
  $("backBtn").onclick = openAlbums;

  // ---------- viewer ----------
  function show(n) {
    if (!photos.length) return;
    i = (n + photos.length) % photos.length;
    const id = photos[i].id, token = ++loadToken;
    img.classList.remove("on"); $("spin").hidden = false;
    const im = new Image();
    im.onload = () => { if (token !== loadToken) return; img.src = im.src; img.alt = "Thanksgiving photo " + (i + 1); img.classList.add("on"); $("spin").hidden = true; };
    im.onerror = () => { if (token !== loadToken) return; if (!im.dataset.alt) { im.dataset.alt = 1; im.src = bigAlt(id); } else { $("spin").hidden = true; toast("This photo couldn’t load"); } };
    im.src = big(id);
    $("count").textContent = (i + 1) + " / " + photos.length;
    $("dl").href = original(id);
    history.replaceState(null, "", "#" + (A + 1) + "-" + (i + 1));
    renderComments(); renderHeart();
    // get the next and previous ones ready
    [1, -1, 2].forEach(k => { const p = photos[(i + k + photos.length) % photos.length]; if (p) new Image().src = big(p.id); });
  }
  const next = () => show(i + 1), prev = () => show(i - 1);
  $("next").onclick = next; $("prev").onclick = prev;
  addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "Escape") {
      const b = document.body.classList;
      if (b.contains("talk") || b.contains("gridon")) b.remove("talk", "gridon"); else if (b.contains("started") && !b.contains("albumson")) openAlbums();
    }
  });

  // swipe left/right (pinch-zoom still works; swipes are ignored while zoomed in)
  let sx = 0, sy = 0, st = 0, multi = false;
  const stage = $("stage");
  stage.addEventListener("touchstart", e => { multi = e.touches.length > 1; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (multi || (window.visualViewport && visualViewport.scale > 1.05)) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - st < 300) toggleBars();
  }, { passive: true });
  stage.addEventListener("click", e => { if (matchMedia("(hover: hover)").matches) toggleBars(); });
  function toggleBars() { if (document.body.classList.contains("talk")) { document.body.classList.remove("talk"); return; } document.body.classList.toggle("clean"); }

  // full screen (where the browser allows it)
  const root = document.documentElement;
  if (root.requestFullscreen) { $("fsBtn").hidden = false; $("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen().catch(() => {}); }

  // ---------- all photos ----------
  $("gridBtn").onclick = () => {
    const box = $("tiles");
    if (!box.children.length) {
      const counts = countMap();
      photos.forEach((p, k) => {
        const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Photo " + (k + 1));
        b.innerHTML = `<img loading="lazy" alt="" src="${thumb(p.id)}">` + (counts[p.id] ? `<span>💬 ${counts[p.id]}</span>` : "");
        b.onclick = () => { document.body.classList.remove("gridon"); show(k); };
        box.appendChild(b);
      });
    }
    [...box.children].forEach((b, k) => b.classList.toggle("cur", k === i));
    $("gridTitle").textContent = label(albums[A].name); $("gridN").textContent = photos.length + " photos";
    document.body.classList.add("gridon");
    const cur = box.children[i]; if (cur) cur.scrollIntoView({ block: "center" });
  };
  $("gridClose").onclick = () => document.body.classList.remove("gridon");

  // ---------- hearts (one per phone; tap again to take it back) ----------
  function renderHeart() {
    if (!photos.length) return;
    const id = photos[i].id;
    $("heartBtn").setAttribute("aria-pressed", mine[id] ? "true" : "false");
    $("hN").textContent = hearts[id] || "";
  }
  $("heartBtn").onclick = async () => {
    const id = photos[i].id, on = !mine[id];
    if (on) mine[id] = 1; else delete mine[id];
    hearts[id] = Math.max(0, (hearts[id] || 0) + (on ? 1 : -1));
    try { localStorage.setItem("tg_hearts", JSON.stringify(mine)); } catch (e) {}
    renderHeart();
    try {
      const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "heart", photo: id, delta: on ? 1 : -1 }) });
      const d = await r.json(); if (d.ok) { hearts[id] = d.hearts; if (photos[i] && photos[i].id === id) renderHeart(); }
    } catch (e) {}
  };

  // ---------- comments ----------
  const countMap = () => comments.reduce((m, c) => (m[c.photo] = (m[c.photo] || 0) + 1, m), {});
  function renderComments() {
    if (!photos.length) return;
    const id = photos[i].id, mine = comments.filter(c => c.photo === id);
    $("cmN").textContent = mine.length || "";
    $("panelTitle").textContent = "Comments · " + label(albums[A].name) + " " + (i + 1);
    const list = $("list"); list.innerHTML = "";
    if (!mine.length) { list.innerHTML = '<p class="none">No comments yet. Be the first!</p>'; return; }
    mine.forEach(c => {
      const d = document.createElement("div"); d.className = "cm";
      const b = document.createElement("b"); b.textContent = c.name || "Someone";
      const t = document.createElement("time"); t.textContent = when(c.at);
      const p = document.createElement("p"); p.textContent = c.text;
      d.append(b, t, p); list.appendChild(d);
    });
  }
  const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  $("talkBtn").onclick = () => { document.body.classList.add("talk"); document.body.classList.remove("clean"); setTimeout(() => $("text").focus({ preventScroll: true }), 320); };
  $("closeTalk").onclick = () => document.body.classList.remove("talk");
  try { $("name").value = localStorage.getItem("tg_name") || ""; } catch (e) {}

  $("form").onsubmit = async e => {
    e.preventDefault();
    const text = $("text").value.trim(), name = $("name").value.trim();
    $("err").textContent = "";
    if (!text) { $("err").textContent = "Write a comment first"; return; }
    $("send").disabled = true; $("send").textContent = "Posting…";
    try {
      const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "comment", photo: photos[i].id, text, name, website: $("website").value }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Couldn’t post");
      if (d.comments) comments = d.comments;
      try { localStorage.setItem("tg_name", name); } catch (e) {}
      $("text").value = ""; renderComments(); toast("Comment posted 🙏");
      $("tiles").innerHTML = "";
    } catch (err) { $("err").textContent = err.message; }
    $("send").disabled = false; $("send").textContent = "Post";
  };

  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

  // check for new comments every minute
  setInterval(async () => {
    if (!SCRIPT_URL || document.hidden || !photos.length) return;
    try { const d = await (await fetch(SCRIPT_URL + "?action=comments&t=" + Date.now())).json(); if (d.ok) { comments = d.comments; if (d.hearts) hearts = d.hearts; renderComments(); renderHeart(); } } catch (e) {}
  }, 60000);

  load();
})();
</script>
</body>
</html>
